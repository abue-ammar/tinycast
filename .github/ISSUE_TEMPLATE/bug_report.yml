name: Bug Report
description: Report a bug running Tinycast
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    id: existing-search
    attributes:
      label: Existing issues
      options:
        - label: I searched open and closed issues and didn't find this already reported
          required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: |
        What you did, what you expected, what you got instead.
        A short recording beats a paragraph.
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recording
      description: Drag and drop images or a screen recording here. Optional but speeds up triage a lot.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Tinycast version + channel
      placeholder: 0.1.0 stable
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.0"
    validations:
      required: true
  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      description: >
        Read
        [CONTRIBUTING.md](https://github.com/abue-ammar/tinycast/blob/main/CONTRIBUTING.md)
        before you write a line — it is required reading, and it is what your PR is held to. Don't
        start until the issue is marked `approved`; an unapproved PR is closed automatically.
      options:
        - label: I'm willing to implement this myself
          required: false
