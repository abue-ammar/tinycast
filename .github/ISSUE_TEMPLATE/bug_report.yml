name: Bug Report
description: Report a bug running Tinycast
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    id: existing-search
    attributes:
      label: Existing issues
      options:
        - label: I searched open and closed issues and didn't find this already reported
          required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: |
        What you did, what you expected, what you got instead.
        A short recording beats a paragraph.
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recording
      description: Drag and drop images or a screen recording here. Optional but speeds up triage a lot.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Tinycast version + channel
      placeholder: 0.1.0 stable
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.0"
    validations:
      required: true
  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      description: >
        **Ticking this is not permission to start.** Wait until a maintainer labels this issue
        `approved` — that label is the only green light. A pull request whose linked issue isn't
        `approved` is closed automatically, unreviewed. Docs-only changes are the exception. Read
        [CONTRIBUTING.md](https://github.com/abue-ammar/tinycast/blob/main/CONTRIBUTING.md)
        first — it is required reading, and it is what your PR is held to.
      options:
        - label: I'm willing to implement this myself **once this issue is labelled `approved`**
          required: false
