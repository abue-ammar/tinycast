name: Feature Request
description: Suggest an idea
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What should it do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it belong in Tinycast?
      description: >
        Tinycast stays small on purpose — quality over quantity. It has already borrowed what it
        wanted from Raycast, so "Raycast has it" is not a reason. Tell us why this is worth its
        weight.
    validations:
      required: true
  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      description: >
        Read
        [CONTRIBUTING.md](https://github.com/abue-ammar/tinycast/blob/main/CONTRIBUTING.md)
        before you write a line — it is required reading, and it is what your PR is held to. Don't
        start until the issue is marked `approved`; an unapproved PR is closed automatically.
      options:
        - label: I'm willing to implement this myself
          required: false
