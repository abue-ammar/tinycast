name: Website

# Builds the Vite site in website/ and deploys it to GitHub Pages at
# https://abue-ammar.github.io/tinycast/. Requires: repo Settings → Pages →
# Source = "GitHub Actions" (one-time setup).
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one Pages deploy at a time, but never cancel an in-progress one:
# cancelling a live deploy-pages run corrupts the deployment and the next run
# fails with "Deployment failed, try again later". Queued runs coalesce instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install & build
        working-directory: website
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
