name: Website

# Builds the Next.js site in website/ and deploys it to Cloudflare at https://tinycast.dev/.
# The old GitHub Pages URL stays alive purely to 301 to it — see the `redirect` job.
# Requires: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets, repo Settings → Pages →
# Source = "GitHub Actions", and Custom domain = tinycast.dev (all one-time setup).
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one website deploy at a time, but never cancel an in-progress one:
# cancelling a live deploy-pages run corrupts the deployment and the next run
# fails with "Deployment failed, try again later". Queued runs coalesce instead.
concurrency:
  group: website
  cancel-in-progress: false

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
      url: https://tinycast.dev/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install & build
        working-directory: website
        run: |
          npm install
          npm run build
      # An assets-only Worker: `out/` is served verbatim, with no code in the request path.
      - name: Deploy to Cloudflare
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

  # Publishes nothing but a CNAME, which is what makes GitHub 301 abue-ammar.github.io/tinycast/*
  # to tinycast.dev/* at its own edge — no HTML, no meta refresh. Independent of the Cloudflare
  # job on purpose: a failed deploy there must not take the forwarder down with it.
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/redirect
      - id: deployment
        uses: actions/deploy-pages@v5
