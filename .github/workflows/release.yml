name: Release

# Shown in the Actions list instead of a bare "Release" — carries the version + channel.
run-name: "Tinycast ${{ inputs.version }} · ${{ inputs.channel }} #${{ github.run_number }}"

# Manually triggered from the Actions tab. Pick a channel and a base version;
# beta builds get an auto-incrementing suffix so re-running never collides.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options: [beta, stable]
        default: beta
      version:
        description: "Base version, e.g. 0.2.0 (no channel suffix)"
        type: string
        required: true

permissions:
  contents: write

# Pinned in one place so the appcast signer can never drift from the Sparkle SPM pin in project.yml.
env:
  SPARKLE_VERSION: "2.9.4"

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26.x found on this runner. Installed Xcodes:"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Compute release metadata
        id: meta
        run: |
          CHANNEL="${{ github.event.inputs.channel }}"
          BASE_VERSION="${{ github.event.inputs.version }}"
          # Each channel is a distinct, side-by-side app: its own display name + bundle id,
          # its own Homebrew cask in the abue-ammar/homebrew-tinycast tap, and its own Sparkle feed
          # (two separate appcasts, never sparkle:channel — a beta host must never be offered the
          # stable DMG). This is the single place channel identity is decided.
          case "$CHANNEL" in
            beta)   SUFFIX="-beta.${GITHUB_RUN_NUMBER}";  DISPLAY="Tinycast Beta";  BUNDLE="com.tinycast.app.beta";  CASK="tinycast@beta";  APPCAST="appcast-beta.xml";  PRERELEASE=true ;;
            stable) SUFFIX="";                            DISPLAY="Tinycast";       BUNDLE="com.tinycast.app";       CASK="tinycast";       APPCAST="appcast.xml";       PRERELEASE=false ;;
          esac
          FULL="${BASE_VERSION}${SUFFIX}"
          {
            echo "full_version=${FULL}"
            echo "display_name=${DISPLAY}"
            echo "bundle_id=${BUNDLE}"
            echo "cask_name=${CASK}"
            echo "appcast_file=${APPCAST}"
            echo "dmg_file=Tinycast-${FULL}.dmg"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      # Import the stable self-signed identity into a temp keychain so every release is signed with
      # the SAME cert — that constant signature is what keeps users' Accessibility (TCC) grant alive
      # across updates. Generate/rotate the secrets per docs/signing.md.
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KPW="$(openssl rand -base64 24)"
          echo "${P12_BASE64}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "${P12_PASSWORD}" -A -T /usr/bin/codesign
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          # Prepend to the search list so xcodebuild's codesign finds "Tinycast Self-Signed".
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"

      # Build the signed .app into an ephemeral DerivedData dir. Channel identity (name, bundle id,
      # version) comes from build-setting overrides so beta/stable ship side-by-side.
      - name: Build app
        env:
          VERSION: ${{ steps.meta.outputs.full_version }}
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          BUNDLE_ID: ${{ steps.meta.outputs.bundle_id }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Tinycast Self-Signed" \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            PRODUCT_NAME="$DISPLAY_NAME" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      # Pack the .app + an /Applications symlink into a compressed DMG under dist/.
      - name: Package DMG
        env:
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          DMG_FILE: ${{ steps.meta.outputs.dmg_file }}
        run: |
          STAGE="$(mktemp -d)"
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release/${DISPLAY_NAME}.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist
          diskutil image create from "$STAGE" --format UDZO --volumeName "$DISPLAY_NAME" "dist/${DMG_FILE}"

      - uses: actions/upload-artifact@v7
        with:
          name: Tinycast-${{ steps.meta.outputs.full_version }}
          path: dist/${{ steps.meta.outputs.dmg_file }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.meta.outputs.full_version }}"
          PRERELEASE_FLAG=""
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            "dist/${{ steps.meta.outputs.dmg_file }}" \
            --title "${{ steps.meta.outputs.display_name }} ${{ steps.meta.outputs.full_version }}" \
            --notes "**Channel:** ${{ github.event.inputs.channel }}
          **Version:** ${{ steps.meta.outputs.full_version }}
          **Bundle ID:** \`${{ steps.meta.outputs.bundle_id }}\`
          Built from ${{ github.sha }}.

          **Recommended:** install via Homebrew — it clears the quarantine flag automatically on every install and update, so there's nothing to run by hand:
          \`\`\`sh
          brew trust --tap abue-ammar/tinycast
          brew install --cask abue-ammar/tinycast/${{ steps.meta.outputs.cask_name }}
          \`\`\`
          This build is self-signed. If you download the DMG directly instead of using Homebrew, macOS will refuse to open it until you clear the quarantine flag once:
          \`\`\`sh
          xattr -dr com.apple.quarantine \"/Applications/${{ steps.meta.outputs.display_name }}.app\"
          \`\`\`" \
            $PRERELEASE_FLAG

      # Sign the DMG with the Sparkle EdDSA key and rewrite this channel's appcast. Runs after the
      # release is published because the item's download URL must already resolve, and before the
      # cask bump so a failure here can't leave the tap ahead of the feed.
      - name: Sign DMG and update appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          APPCAST: ${{ steps.meta.outputs.appcast_file }}
          CASK: ${{ steps.meta.outputs.cask_name }}
          VERSION: ${{ steps.meta.outputs.full_version }}
        run: |
          if [ -z "${SPARKLE_ED_PRIVATE_KEY}" ]; then
            echo "::warning::SPARKLE_ED_PRIVATE_KEY secret not set — skipping appcast update. Add it to enable in-app updates."
            exit 0
          fi
          curl -fsSL -o /tmp/sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p /tmp/sparkle
          tar -xJf /tmp/sparkle.tar.xz -C /tmp/sparkle
          # --ed-key-file - reads the key from stdin, so it never lands in a Keychain, a file or the
          # log. dist/ holds only the DMG just built, so the feed ends up with exactly that one item
          # — which is all Sparkle needs — and deltas are off because there is no older archive here.
          echo "${SPARKLE_ED_PRIVATE_KEY}" | /tmp/sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/abue-ammar/tinycast/releases/download/v${VERSION}/" \
            --maximum-deltas 0 \
            -o "website/public/${APPCAST}" \
            dist/
          # Land the appcast on main and nothing else: the workflow can be dispatched from any ref,
          # so pushing HEAD would drop that ref's whole history onto main. Replay just this one file.
          git fetch --depth=1 origin main
          cp "website/public/${APPCAST}" "${RUNNER_TEMP}/${APPCAST}"
          git checkout -B appcast-publish FETCH_HEAD
          cp "${RUNNER_TEMP}/${APPCAST}" "website/public/${APPCAST}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "website/public/${APPCAST}"
          if git diff --cached --quiet; then
            echo "No appcast changes to commit."
            exit 0
          fi
          git commit -m "appcast: ${CASK} ${VERSION}"
          # The commit touches website/, which is exactly what .github/workflows/website.yml watches,
          # so pushing it is what deploys the new feed to GitHub Pages.
          if ! git push origin HEAD:main; then
            # main moved while we were building — replay this one commit on top of it and retry once.
            git fetch --depth=1 origin main
            git rebase FETCH_HEAD || { echo "::error::Could not rebase the appcast commit onto main."; exit 1; }
            git push origin HEAD:main || { echo "::error::Could not push the appcast commit to main."; exit 1; }
          fi

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          CASK: ${{ steps.meta.outputs.cask_name }}
          VERSION: ${{ steps.meta.outputs.full_version }}
          DMG_FILE: ${{ steps.meta.outputs.dmg_file }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret not set — skipping cask bump. Add it to enable auto-updates of the tap."
            exit 0
          fi
          SHA="$(shasum -a 256 "dist/${DMG_FILE}" | awk '{print $1}')"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/abue-ammar/homebrew-tinycast.git" tap
          CASK_FILE="tap/Casks/${CASK}.rb"
          if [ ! -f "$CASK_FILE" ]; then
            echo "::error::$CASK_FILE not found in tap."
            exit 1
          fi
          sed -i '' -E "s|^  version \".*\"|  version \"${VERSION}\"|" "$CASK_FILE"
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" "$CASK_FILE"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/${CASK}.rb"
          if git diff --cached --quiet; then
            echo "No cask changes to commit."
          else
            git commit -m "${CASK} ${VERSION}"
            git push
          fi

      # Announce the release in the Discord release channel. A Components V2 (flags 32768) card:
      # channel-tinted container, title + right-aligned Download button, Homebrew install block.
      # No-ops with a warning if the webhook secret isn't set.
      - name: Announce on Discord
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHANNEL: ${{ github.event.inputs.channel }}
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          VERSION: ${{ steps.meta.outputs.full_version }}
          CASK: ${{ steps.meta.outputs.cask_name }}
          TAG: v${{ steps.meta.outputs.full_version }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret not set — skipping Discord announcement."
            exit 0
          fi
          if [ "${CHANNEL}" = "stable" ]; then COLOR=3066993; else COLOR=15844367; fi
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          INSTALL="brew install --cask abue-ammar/tinycast/${CASK}"
          # Build with jq so backticks stay literal (printf in single quotes escaped them,
          # which Discord rendered as verbatim backticks instead of a code block).
          jq -n \
            --argjson color "${COLOR}" \
            --arg heading "## 🚀 ${DISPLAY_NAME} ${VERSION}" \
            --arg sub "Now available on the **${CHANNEL}** channel." \
            --arg install "${INSTALL}" \
            --arg url "${RELEASE_URL}" \
            '{
              flags: 32768,
              components: [
                { type: 17, accent_color: $color, components: [
                  { type: 9,
                    components: [ { type: 10, content: ($heading + "\n" + $sub) } ],
                    accessory: { type: 2, style: 5, label: "Download", url: $url }
                  },
                  { type: 14 },
                  { type: 10, content: ("**Install / update via Homebrew**\n```\n" + $install + "\n```") }
                ] }
              ]
            }' > payload.json
          curl -fsS -X POST -H "Content-Type: application/json" -d @payload.json \
            "${DISCORD_WEBHOOK_URL}?with_components=true"
