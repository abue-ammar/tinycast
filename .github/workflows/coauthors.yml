name: Co-authors

# pull_request_target so forked PRs can be commented on — no checkout, API calls only.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const marker = "<!-- tinycast:ai-coauthors -->";
            const tools = /claude|anthropic|codex|openai|chatgpt|copilot|cursor|gemini|devin|aider|windsurf|codeium/i;
            const pr = context.payload.pull_request;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              ...repo, pull_number: pr.number, per_page: 100
            });
            const offending = commits.flatMap((c) =>
              c.commit.message.split("\n")
                .filter((line) => /^co-authored-by:/i.test(line.trim()) && tools.test(line))
                .map((line) => ({ sha: c.sha.slice(0, 7), subject: c.commit.message.split("\n")[0], trailer: line.trim() }))
            );

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...repo, issue_number: pr.number, per_page: 100
            });
            const previous = comments.find((c) => c.body?.includes(marker));

            if (offending.length === 0) {
              if (previous) await github.rest.issues.deleteComment({ ...repo, comment_id: previous.id });
              return;
            }

            const body = [
              marker,
              "> [!WARNING]",
              "> **This PR can't be merged: its commits credit an AI tool as a co-author.**",
              "",
              "| Commit | Subject | Trailer |",
              "| --- | --- | --- |",
              ...offending.map((o) => `| \`${o.sha}\` | ${o.subject.replace(/\|/g, "\\|")} | \`${o.trailer}\` |`),
              "",
              "Remove these `Co-authored-by:` lines from the commit messages and force-push. From the PR",
              "branch, this rewrites every commit on it in place:",
              "",
              "```sh",
              "git fetch origin main",
              "git rebase --keep-base origin/main --exec \\",
              `  'git log -1 --format=%B | grep -viE "^co-authored-by:.*(${tools.source})" | git commit --amend -F -'`,
              "git push --force-with-lease",
              "```",
              "",
              "This check re-runs on the push and this comment disappears once it passes.",
            ].join("\n");

            if (previous) {
              await github.rest.issues.updateComment({ ...repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...repo, issue_number: pr.number, body });
            }
            for (const o of offending) core.error(`${o.sha} ${o.subject}: ${o.trailer}`);
            core.setFailed(`${offending.length} AI co-author trailer(s) found. See the PR comment to fix.`);
