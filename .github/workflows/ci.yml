name: CI

# The job is a merge gate. There is no xcodebuild step: the full Debug build costs minutes and the
# release workflow already builds before it ships, so CI keeps to the checks that finish in about
# a minute. All go through the scripts rather than naming rules or harnesses here, so this file
# cannot drift from them. See docs/testing.md.
#
# PRs only, deliberately. `pull_request` builds the *merge result*, so a push to `main` that came from
# a green PR would re-test content CI has already seen. Use "Run workflow" for a direct push to main.
on:
  pull_request:
  workflow_dispatch:

# A new push supersedes the previous run for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26.x found on this runner. Installed Xcodes:"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      # The pbxproj is generated from project.yml but committed, so a source file that skipped
      # `xcodegen generate` would compile in the harnesses yet be missing from the app target.
      - name: Project file matches project.yml
        run: |
          brew install xcodegen
          xcodegen generate
          git diff --exit-code Tinycast.xcodeproj || {
            echo "::error::Tinycast.xcodeproj is stale — run 'xcodegen generate' and commit."
            exit 1
          }

      - name: Run the harnesses
        run: ./Scripts/run-tests.sh

      # `if: always()` so a failing harness still surfaces the lint annotations in the same run.
      # Warnings annotate the diff; only lint *errors* fail the job, matching a local run.
      - name: Lint
        if: always()
        env:
          SWIFTLINT_REPORTER: github-actions-logging
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          ./Scripts/lint.sh
