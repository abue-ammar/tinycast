# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Swift-only review. AGENTS.md and docs/standards.md are the house rules and win over this file.

language: en-US

tone_instructions: >-
  Senior Swift and macOS engineer. Direct and terse. Name the problem, the fix and why it matters.
  No praise, no recaps, no formatting nits.

reviews:
  profile: assertive

  high_level_summary: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  poem: false
  in_progress_fortune: false

  auto_review:
    ignore_title_keywords:
      - WIP
      - DO NOT REVIEW

  # These filters also drive the sparse checkout, so the lint config and guideline docs stay listed.
  path_filters:
    - "**/*.swift"
    - "!**/*.generated.swift"
    - ".swiftlint.yml"
    - "project.yml"
    - "AGENTS.md"
    - "docs/standards.md"

  path_instructions:
    - path: "**/*.swift"
      instructions: |
        Tinycast supports macOS 26 and later, with macOS 27 strongly preferred. Swift 6+ with complete
        strict concurrency is required. Prefer the latest Swift patterns and modern Apple APIs;
        no compatibility layers or legacy workarounds.
        Verify API and language-feature availability against the SDK and compiler used by the build
        and CI; state any SDK or compiler requirement with a suggested replacement.
        Use direct availability checks where macOS 27+ APIs require them to preserve macOS 26 support.

        Comment only when the change makes the code wrong, slower, harder to change, or older than
        it needs to be. A few strong findings beat many weak ones. Always give the concrete fix.

        Review the changed Swift code and affected call sites directly for bugs, regressions,
        code smells and better modern implementations. Check bounds, optional handling, state
        transitions, error paths and persistence for data loss or inconsistent state.

        Code quality and smells:
        - A function or type with more than one job, or a body that needs section comments.
        - Deep nesting that guard and early return would flatten.
        - Flag arguments (doThing(true)) and stringly-typed state where an enum fits.
        - Duplicated logic that should be one function. Duplicating extension views and layout
          math for containment is intentional; duplicated runtime logic still needs review.
        - Abstraction with no payoff: unnecessary protocols, generics, factories and forwarding
          wrappers. A single use can reveal this smell; check whether the abstraction has a purpose.
        - var that could be let, a class that could be a struct, any P where some P or a generic
          works, AnyView where a concrete type or @ViewBuilder works.
        - Force unwraps and casts whose assumed invariant can fail; try? that drops an error
          the user should see. Do not repeat mechanical checks already covered by SwiftLint.
        - Dead code, unused parameters, commented-out code, obsolete compatibility paths.
        - Hard-coded colours, spacing, radii or fonts where an existing token applies. Theme owns
          shared tokens; extension-specific layout values stay in Features/Extensions/.
        - Comments that restate the code, run two lines in a row, or narrate the change.

        Modern Swift:
        - Typed throws where the error set is closed; if and switch expressions where clearer.
        - Checked Sendable value types for sharing and sending for ownership transfer, instead
          of @unchecked Sendable workarounds where the invariant can be expressed safely.
        - Mutex (Synchronization) over NSLock or a serial DispatchQueue for state outside an actor.
        - Duration, ContinuousClock and Task.sleep(for:) for elapsed time and delays, instead of
          raw nanoseconds or wall-clock Date arithmetic. Keep Date for calendar and wall-clock time.
        - For genuinely asynchronous event streams, AsyncStream.makeStream(of:) and async
          sequences over callback plumbing. Preserve synchronous callbacks and their semantics.
        - FormatStyle (.formatted) over new DateFormatter or NumberFormatter instances for display.
        - URL(filePath:), appending(path:) and URL.homeDirectory over string paths; pure models
          still receive the home directory as a parameter.

        Strict concurrency:
        - Prefer synchronous code. Keep short UI and state operations synchronous on @MainActor.
          Introduce concurrency only for genuinely asynchronous operations or blocking work that
          must leave the main actor. Shared state alone does not justify async, a Task, or an actor.
          Preserve synchronous callback returns and event ordering. When concurrency is needed,
          prefer structured concurrency with clear ownership and cancellation. Strict concurrency
          checking enforces safety; it does not require making operations asynchronous.
        - @MainActor is the default. Never suggest a new actor or global actor.
        - Heavy or IO work (file scans, image decode, SQLite, shell, large JSON) runs off-main.
          Prefer @concurrent async functions for work that must leave the caller's actor; use
          Task.detached when an independent task is needed. async or nonisolated alone is not a
          guarantee of off-main execution. Check the actual isolation and compiler settings.
        - Values shared across isolation boundaries are Sendable; use sending for safe ownership
          transfer. Flag @unchecked Sendable, nonisolated(unsafe) and @preconcurrency without a reason.
        - Flag new MainActor.assumeIsolated; it traps if the executor assumption is wrong. Use an
          isolated conformance when the protocol is MainActor-bound; otherwise establish the
          callback's actor boundary without breaking synchronous return or ordering semantics.
        - Flag DispatchQueue, DispatchGroup, semaphores, OperationQueue, performSelector and
          completion handlers where async/await fits. DispatchQueue.main.async never fixes an
          ordering bug.
        - Every long-lived Task has an owner and teardown. Store and cancel service tasks in
          stop() or deinit; SwiftUI .task follows view lifetime. Long loops check cancellation.
          Prefer async let and task groups to detached bookkeeping. Propagate cancellation to
          detached or callback-backed work owned by the caller; do not cancel shared work for one
          waiter or report CancellationError as an ordinary failure.
        - After awaits and before mutation, revalidate cancellation, operation identity and the
          destination when a result can become stale. Actor isolation alone does not prevent this.
        - Use [weak self] to prevent cycles or unintended retention; [unowned self] needs a
          lifetime guarantee. Bounded intentional strong capture is valid. Check Task, Timer,
          NotificationCenter, KVO and stored closures; unwrapping weak self before a long await
          can still retain the owner for the whole operation.
        - Teardown that must run on the actor uses isolated deinit.
        - A continuation resumes exactly once across success, failure and cancellation; no
          suspended waiter or owned producer work is left behind.

        SwiftUI and AppKit:
        - @Observable with @State, @Bindable and @Environment(Type.self); no type annotation on
          keyless @Environment properties. Flag ObservableObject, @Published, @StateObject,
          @ObservedObject, @EnvironmentObject and Combine for state.
        - @ObservationIgnored on memo caches and lazy collaborators.
        - @Entry for environment keys, .task or .task(id:) over onAppear plus Task, and the zero- or
          two-parameter onChange.
        - Flag deprecated and soft-deprecated API and name the replacement: foregroundColor,
          cornerRadius, NavigationView, activate(ignoringOtherApps:), launchApplication, lockFocus,
          kUTType, icon(forFileType:), SMLoginItemSetEnabled and the like.
        - Bodies stay declarative: move IO, business logic and expensive sorting or formatting
          out of body. Extract a subview before a computed some View helper.
        - Flag ForEach ids that are not stable and unique, duplicated state that can drift, and
          state that invalidates a whole view tree when one property changed. Check environment
          injection when adding a hosting boundary; a missing injection can trap at runtime.
        - Custom controls carry an accessibility label and traits.

        Efficiency (resident memory under 100 MB, and the palette must feel instant):
        - Flag unnecessary allocation and expensive sorting, filtering, regex or formatter
          creation repeated per keystroke, per row or per render. Hoist it, or build it once per show.
        - Flag hidden O(n^2): contains or firstIndex inside a loop where a Set or Dictionary fits.
        - Flag synchronous IO on the main actor, and new work in AppCore.start() or an init that
          could run on first use.
        - Flag unbounded caches and histories, and obsolete NSImage, CGImage or Data retained past
          their useful lifetime. Respect intentional shared caches and persisted history.
          A new cache needs a measurement in the PR.

        Never suggest:
        - Compatibility layers, legacy workarounds, support below macOS 26, migration scaffolding
          or speculative fallbacks.
        - A singleton or static shared; AppCore owns long-lived state.
        - NSAlert, .alert, .confirmationDialog or .popover; use DialogController or HUDPresenter.
        - URLSession.shared; networking copies CurrencyRateStore's ephemeral session.
        - scrollEdgeEffectStyle in the borderless panels; they use edgeDissolve().
        - XCTest or Swift Testing; Tests/ holds standalone harnesses.
        - Doc comments or comment blocks; comments are rare, one line, and explain the why.
        - Third-party packages.
        - isEmpty for count on LauncherRankingRecord or PaletteRowIndex; that count is a hit count.
        - Anything SwiftLint already reports, or formatting.

        Recommend newer APIs such as Observations and @concurrent when they improve changed code.
        Check observation timing, task ownership, priority and cancellation semantics; they are not
        automatic drop-in replacements. @available(*, unavailable) on init(coder:) is intentional.

    - path: "Tinycast/Features/*/Model/**"
      instructions: |
        Pure model layer, compiled directly by the test harnesses.
        - No import of AppKit, SwiftUI or Cocoa.
        - Clock, filesystem, home directory, locale and rates come in as parameters. Flag new
          ambient reads of Date(), FileManager.default, NSHomeDirectory() or Locale.current that
          a harness cannot override; defaulted injected parameters are allowed.

    - path: "Tinycast/Features/Extensions/**"
      instructions: |
        Runs untrusted Raycast extensions in JavaScriptCore.
        - Treat every JS value as hostile: check types, sizes, paths and URLs.
        - Flag retain cycles between JS callbacks and Swift owners.
        - Views, layout and sizing stay in this folder. Only Theme base tokens, InterfaceMetrics,
          PopoverMenuItem and Platform/ come from outside.

    - path: "Tinycast/DesignSystem/Scrolling/{EdgeDissolve,ThinScrollbar}.swift"
      instructions: |
        Off-limits, tuned by eye. Flag any edit unless the PR says it exists to change this file.

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: true

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"

  tools:
    swiftlint:
      enabled: true
      config_file: .swiftlint.yml

chat:
  art: false

knowledge_base:
  code_guidelines:
    filePatterns:
      - files: "docs/standards.md"
        applyTo: "**/*.swift"
