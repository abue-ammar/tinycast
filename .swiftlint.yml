included:
  - Tinycast
  - Tests

excluded:
  - Tinycast/DesignSystem/Scrolling/EdgeDissolve.swift
  - Tinycast/DesignSystem/Scrolling/ThinScrollbar.swift
  - Tinycast/Features/Emoji/Model/EmojiData.generated.swift
  - Tinycast/Features/Calculator/Model/CurrencyData.generated.swift

disabled_rules:
  - todo                                      # tracked in issues, not by the linter
  - trailing_whitespace                       # cosmetic, and nothing auto-fixes it on save
  - identifier_name                           # rejects `id`, `dx`, `x` — all correct here
  - type_body_length                          # a SwiftUI view is legitimately long
  - function_body_length
  - file_length                               # RootPaletteView is 662 lines by design
  - cyclomatic_complexity                     # a switch over AppEntry.Kind is not complex
  - nesting                                   # namespace enums are the house style
  - large_tuple
  - function_parameter_count                  # SwiftUI initialisers
  - multiple_closures_with_trailing_closure   # fights SwiftUI
  - opening_brace                             # ─┐ a formatter's job, and there is no formatter
  - trailing_comma                            # ─┘ here, so these would just be standing noise
  # `count` is a hit count on LauncherRankingRecord and PaletteRowIndex, not a collection count.
  # This rule rewrites `count == 0` to `isEmpty` on both, which does not compile.
  - empty_count

opt_in_rules:
  - first_where
  - last_where
  - contains_over_filter_count
  - contains_over_first_not_nil
  - optional_data_string_conversion
  - implicitly_unwrapped_optional
  - redundant_nil_coalescing
  - toggle_bool
  - static_over_final_class
  - unneeded_parentheses_in_closure_argument
  - weak_delegate

# A `try!` is never acceptable. A `force_cast` sometimes is — the AX and AppKit bridges have four —
# so it warns rather than blocks.
force_try: error
force_cast: warning

type_name:
  min_length: 2     # `ID` is the correct name for an Identifiable's ID

line_length:
  warning: 130
  ignores_urls: true
  ignores_comments: false

# The layering rule and the Swift Testing shape, which no built-in rule covers. Errors, so they block.
# Regexes run per file with `^` matching at each line start.
custom_rules:
  model_purity:
    name: Model purity
    included: 'Tinycast/Features/(PaletteRowIndex\.swift|[^/]+/Model/.*\.swift)$'
    regex: '^\s*(@\w+(\([^)]*\))?\s+)*import\s+(\w+\s+)?(AppKit|SwiftUI|Cocoa)\b'
    excluded_match_kinds: [comment, doccomment, string]
    message: 'A Model/ file stays Foundation-only; take the fact it needs as a parameter.'
    severity: error
  test_main:
    name: Harness entry point in a suite
    included: 'Tests/TinycastTests/.*\.swift$'
    regex: '@main\b|\bstatic\s+func\s+main\b'
    excluded_match_kinds: [comment, doccomment, string]
    message: 'A suite is @Test functions; Swift Testing runs them, never a main().'
    severity: error
  test_process_stop:
    name: Crash or exit in a suite
    included: 'Tests/TinycastTests/.*\.swift$'
    regex: '(?<![.\w])((Darwin|Foundation|Swift)\.)?(exit|fatalError|precondition|preconditionFailure|assert|assertionFailure)\('
    excluded_match_kinds: [comment, doccomment, string]
    message: 'A failed #expect fails one test; these kill the host and every other suite. Use #expect or #require.'
    severity: error
  test_output:
    name: Printing in a suite
    included: 'Tests/TinycastTests/.*\.swift$'
    regex: '(?<![.\w])((Swift|Foundation)\.)?(print|debugPrint|dump|NSLog)\(|\bFileHandle\.standard(Error|Output)\b'
    excluded_match_kinds: [comment, doccomment, string]
    message: 'A check reports through #expect, which prints its own values.'
    severity: error
  test_mutable_global:
    name: Mutable shared state in a suite
    included: 'Tests/TinycastTests/.*\.swift$'
    regex: '\bstatic\s+var\s+\w+[^{\n]*$|^((@\w+(\([^)\n]*\))?|[\w()]+)[ \t]+)*var[ \t]'
    excluded_match_kinds: [comment, doccomment, string]
    message: 'Tests run in parallel; shared fixtures are static let, the rest is built in init.'
    severity: error
  test_xctest:
    name: XCTest in a suite
    included: 'Tests/TinycastTests/.*\.swift$'
    regex: '\bXCT\w*'
    excluded_match_kinds: [comment, doccomment, string]
    message: 'Suites are Swift Testing only.'
    severity: error
  test_known_issue:
    name: Hidden failure in a suite
    included: 'Tests/TinycastTests/.*\.swift$'
    regex: '\bwithKnownIssue\b|\.disabled\('
    excluded_match_kinds: [comment, doccomment, string]
    message: 'A test that fails is fixed or deleted, never marked known or disabled.'
    severity: error
  test_blocking_wait:
    name: Blocking wait in a suite
    included: 'Tests/TinycastTests/.*\.swift$'
    regex: '\bDispatch(Semaphore|Group)\b|\bRunLoop\.(main|current)\.run\b|\bCFRunLoopRun\w*|\bThread\.sleep\b|(?<![.\w])u?sleep\('
    excluded_match_kinds: [comment, doccomment, string]
    message: 'Await the subject, or use confirmation; a blocked thread waits for nothing.'
    severity: error
  test_shared_defaults:
    name: Shared defaults in a suite
    included: 'Tests/TinycastTests/.*\.swift$'
    regex: '\bUserDefaults\.standard\b|\bUserDefaults\(\)'
    excluded_match_kinds: [comment, doccomment, string]
    message: 'The host is the real dev app; use a UserDefaults(suiteName:) unique to the test.'
    severity: error
  test_shared_pasteboard:
    name: Shared pasteboard in a suite
    included: 'Tests/TinycastTests/.*\.swift$'
    regex: '\bNSPasteboard\.general\b|NSPasteboard\(name:\s*\.general'
    excluded_match_kinds: [comment, doccomment, string]
    message: 'A running Tinycast records the general board; use NSPasteboard.withUniqueName().'
    severity: error
  test_check_helper:
    name: Assertion helper in a suite
    included: 'Tests/TinycastTests/.*\.swift$'
    regex: '\bfunc\s+(expect|check|fail|verify|assert)([A-Z]\w*)?\s*[(<]'
    excluded_match_kinds: [comment, doccomment, string]
    message: 'The #expect stays in the test, so a failure points at its own line.'
    severity: error
